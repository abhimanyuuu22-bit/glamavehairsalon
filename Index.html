<style>
/* ============================================================
   RESET
============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, h3, p, ul, figure { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img, svg { display: block; max-width: 100%; }

/* ============================================================
   DESIGN TOKENS
   Brand is intentionally always-dark (near-black + champagne
   gold), so the light-scheme and dark-scheme token blocks below
   carry the same values on purpose ­— this is a fixed brand
   identity, not a page that should invert for system light mode.
============================================================ */
:root{
  --black:        #0D0B08;
  --charcoal:      #1B1712;
  --charcoal-2:    #231E16;
  --gold:          #C9A659;
  --gold-rgb:      201, 166, 89;
  --gold-light:    #E8CD8C;
  --gold-deep:     #9A7A3E;
  --cream:         #F3EEE3;
  --cream-rgb:     243, 238, 227;
  --cream-dim:     #C7BFAF;
  --beige:         #B9A484;

  --font-display:  "Bodoni Moda", Georgia, "Times New Roman", serif;
  --font-body:     "Jost", "Segoe UI", Helvetica, Arial, sans-serif;

  --fs-hero:   clamp(2.6rem, 9vw, 5.8rem);
  --fs-h2:     clamp(1.9rem, 5vw, 3.1rem);
  --fs-h3:     clamp(1.25rem, 2.6vw, 1.6rem);
  --fs-lead:   clamp(1.05rem, 2.2vw, 1.25rem);

  --radius-sm: 3px;
  --radius-md: 12px;
  --radius-lg: 22px;

  --container: 1240px;
  --header-h: 76px;

  --ease: cubic-bezier(.16,.84,.44,1);
  --dur: .6s;

  --bg: var(--black);
  --text: var(--cream);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg: var(--black); --text: var(--cream); }
}
:root[data-theme="dark"]{ --bg: var(--black); --text: var(--cream); }

@media (min-width: 1024px){ :root{ --header-h: 92px; } }

/* ============================================================
   BASE
============================================================ */
html{ scroll-behavior: smooth; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
section[id]{ scroll-margin-top: var(--header-h); }
h1, h2, h3{ font-family: var(--font-display); font-weight: 500; line-height: 1.12; letter-spacing: .01em; }
p{ color: var(--cream-dim); max-width: 62ch; }

.wrap{ width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: 1.35rem; }
@media (min-width: 768px){ .wrap{ padding-inline: 2.5rem; } }
@media (min-width: 1024px){ .wrap{ padding-inline: 3rem; } }

.eyebrow{
  display: inline-flex; align-items: center; gap: .6rem;
  font-family: var(--font-body); font-size: .78rem; font-weight: 500;
  letter-spacing: .22em; text-transform: uppercase; color: var(--gold);
}
.eyebrow::before{ content:""; width: 22px; height: 1px; background: var(--gold); }

.skip-link{
  position: absolute; left: -9999px; top: 0; z-index: 999;
  background: var(--gold); color: var(--black); padding: .6rem 1rem; border-radius: var(--radius-sm);
}
.skip-link:focus{ left: 1rem; top: 1rem; }

:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 2px; }

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  padding: .95rem 1.9rem; font-family: var(--font-body); font-weight: 500;
  font-size: .85rem; letter-spacing: .12em; text-transform: uppercase;
  border-radius: var(--radius-sm); border: 1px solid transparent;
  transition: transform .3s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease);
  white-space: nowrap;
}
.btn svg{ width: 16px; height: 16px; flex-shrink: 0; }
.btn-gold{
  background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-deep));
  color: #201804;
}
.btn-gold:hover{ transform: translateY(-2px); box-shadow: 0 10px 30px -8px rgba(var(--gold-rgb), .55); }
.btn-outline{ background: transparent; color: var(--cream); border-color: rgba(var(--cream-rgb), .35); }
.btn-outline:hover{ border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
.btn-ghost{ background: rgba(var(--gold-rgb), .1); color: var(--gold); border-color: rgba(var(--gold-rgb), .4); }
.btn-ghost:hover{ background: rgba(var(--gold-rgb), .18); transform: translateY(-2px); }
.btn-sm{ padding: .68rem 1.3rem; font-size: .72rem; }
.btn-row{ display: flex; flex-wrap: wrap; gap: .9rem; }

/* ============================================================
   HEADER / NAV
============================================================ */
#site-header{
  position: fixed; inset: 0 0 auto 0; z-index: 500;
  height: var(--header-h);
  display: flex; align-items: center;
  background: linear-gradient(to bottom, rgba(13,11,8,.55), transparent);
  transition: background .4s var(--ease), backdrop-filter .4s var(--ease), border-color .4s var(--ease);
  border-bottom: 1px solid transparent;
}
#site-header.scrolled{
  background: rgba(13,11,8,.78);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom-color: rgba(var(--gold-rgb), .18);
}
.navbar{ width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }

.brand{ display: flex; align-items: center; gap: .65rem; }
.brand-mark{ width: 30px; height: 30px; color: var(--gold); flex-shrink: 0; }
.brand-text{ display: flex; flex-direction: column; line-height: 1; }
.brand-name{ font-family: var(--font-display); font-size: 1.28rem; color: var(--cream); letter-spacing: .02em; }
.brand-sub{ font-size: .56rem; letter-spacing: .28em; color: var(--gold); margin-top: .28rem; }

.nav-links{ display: none; }
.nav-actions{ display: flex; align-items: center; gap: .9rem; }
.nav-actions .btn-gold.btn-sm{ display: none; }

.hamburger{
  display: flex; flex-direction: column; justify-content: center; gap: 5px;
  width: 42px; height: 42px; border: 1px solid rgba(var(--gold-rgb), .35); border-radius: var(--radius-sm);
  align-items: center;
}
.hamburger span{ width: 18px; height: 1px; background: var(--gold); transition: transform .3s var(--ease), opacity .3s var(--ease); }
.hamburger[aria-expanded="true"] span:nth-child(1){ transform: translateY(6px) rotate(45deg); }
.hamburger[aria-expanded="true"] span:nth-child(2){ opacity: 0; }
.hamburger[aria-expanded="true"] span:nth-child(3){ transform: translateY(-6px) rotate(-45deg); }

.mobile-panel{
  position: fixed; inset: 0; z-index: 490;
  background: #0D0B08;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2.2rem;
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity .35s var(--ease), transform .35s var(--ease), visibility .35s;
}
.mobile-panel.open{ opacity: 1; visibility: visible; transform: translateY(0); }
.mobile-panel a{ font-family: var(--font-display); font-size: 1.7rem; color: var(--cream); }
.mobile-panel a:hover{ color: var(--gold); }

@media (min-width: 960px){
  .nav-links{
    display: flex; gap: 2.2rem; font-size: .92rem; letter-spacing: .01em;
  }
  .nav-links a{ position: relative; padding-block: .3rem; color: var(--cream-dim); transition: color .25s; }
  .nav-links a::after{
    content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px;
    background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease);
  }
  .nav-links a:hover{ color: var(--cream); }
  .nav-links a:hover::after{ transform: scaleX(1); }
  .nav-actions .btn-gold.btn-sm{ display: inline-flex; }
  .hamburger{ display: none; }
  .mobile-panel{ display: none; }
}

/* ============================================================
   HERO
============================================================ */
.hero{
  position: relative; min-height: 100svh; display: flex; align-items: center;
  padding-top: var(--header-h); overflow: hidden;
  background: radial-gradient(120% 90% at 50% -10%, #241d12 0%, #0D0B08 55%), #0D0B08;
}
.hero-glow{
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
}
.hero-glow span{
  position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55;
  animation: drift 16s ease-in-out infinite alternate;
}
.hero-glow span.g1{ width: 46vw; height: 46vw; top: -12%; right: -8%; background: radial-gradient(circle, rgba(var(--gold-rgb),.35), transparent 70%); }
.hero-glow span.g2{ width: 32vw; height: 32vw; bottom: -10%; left: -6%; background: radial-gradient(circle, rgba(var(--gold-rgb),.22), transparent 70%); animation-delay: -4s; }
.hero-ring{
  position: absolute; top: 50%; left: 50%; width: min(70vw, 720px); height: min(70vw, 720px);
  border: 1px solid rgba(var(--gold-rgb), .16); border-radius: 50%;
  transform: translate(-50%, -46%); pointer-events: none; z-index: 0;
}
@keyframes drift{ from{ transform: translate3d(0,0,0) scale(1); } to{ transform: translate3d(-3%, 4%, 0) scale(1.06); } }

.hero-inner{ position: relative; z-index: 2; width: 100%; text-align: center; padding-block: 3rem; }
.hero-tag{ display: block; margin-bottom: 1.4rem; }
.hero h1{
  font-size: var(--fs-hero); color: var(--cream);
}
.hero h1 .line{ display: block; overflow: hidden; }
.hero h1 .line span{
  display: inline-block; transform: translateY(115%); opacity: 0;
  transition: transform 1s var(--ease), opacity 1s var(--ease);
}
.hero.loaded h1 .line:nth-child(1) span{ transition-delay: .15s; }
.hero.loaded h1 .line:nth-child(2) span{ transition-delay: .32s; }
.hero.loaded h1 .line span{ transform: translateY(0); opacity: 1; }
.hero h1 .accent{ color: var(--gold); }

.hero-lead{
  margin: 1.6rem auto 0; font-size: var(--fs-lead); color: var(--cream-dim); max-width: 46ch;
  opacity: 0; transform: translateY(14px); transition: opacity .9s var(--ease) .55s, transform .9s var(--ease) .55s;
}
.hero.loaded .hero-lead{ opacity: 1; transform: translateY(0); }

.hero .btn-row{ justify-content: center; margin-top: 2.4rem; opacity: 0; transform: translateY(14px); transition: opacity .9s var(--ease) .75s, transform .9s var(--ease) .75s; }
.hero.loaded .btn-row{ opacity: 1; transform: translateY(0); }

.hero-location{
  margin-top: 3rem; font-size: .82rem; letter-spacing: .06em; color: var(--cream-dim);
  opacity: 0; transition: opacity 1s var(--ease) .95s;
}
.hero.loaded .hero-location{ opacity: 1; }
.hero-location strong{ color: var(--gold); font-weight: 500; }

.scroll-cue{
  position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 2;
  width: 1px; height: 42px; background: linear-gradient(to bottom, rgba(var(--gold-rgb),.7), transparent);
}
@media (min-width: 768px){ .hero h1 br{ display: block; } }

/* ============================================================
   SECTION SPACING
============================================================ */
.section{ padding-block: clamp(4rem, 9vw, 7.5rem); position: relative; }
.section-head{ max-width: 640px; }
.section-head h2{ margin-top: .9rem; font-size: var(--fs-h2); color: var(--cream); }
.section-head p{ margin-top: 1.1rem; font-size: 1.05rem; }
.center{ text-align: center; margin-inline: auto; }
.center p{ margin-inline: auto; }

/* ============================================================
   REVEAL ANIMATION
============================================================ */
.reveal{ opacity: 0; transform: translateY(26px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.reveal.is-visible{ opacity: 1; transform: translateY(0); }

/* ============================================================
   PLACEHOLDER FRAME (used for About image + Gallery tiles)
============================================================ */
.frame{
  position: relative; border-radius: var(--radius-md); overflow: hidden;
  background: linear-gradient(160deg, var(--charcoal-2), var(--charcoal) 60%, #171310);
  border: 1px solid rgba(var(--gold-rgb), .22);
  display: flex; align-items: center; justify-content: center;
}
.frame::before, .frame::after{
  content: ""; position: absolute; width: 26px; height: 26px; pointer-events: none;
}
.frame::before{ top: 12px; left: 12px; border-top: 1px solid rgba(var(--gold-rgb), .6); border-left: 1px solid rgba(var(--gold-rgb), .6); }
.frame::after{ bottom: 12px; right: 12px; border-bottom: 1px solid rgba(var(--gold-rgb), .6); border-right: 1px solid rgba(var(--gold-rgb), .6); }
.frame-body{ text-align: center; padding: 1.2rem; color: var(--cream-dim); }
.frame-body svg{ width: 30px; height: 30px; margin: 0 auto .7rem; color: var(--gold); }
.frame-body .frame-label{ font-family: var(--font-body); font-size: .82rem; letter-spacing: .04em; color: var(--cream); }
.frame-body .frame-tag{
  display: inline-block; margin-top: .55rem; font-size: .64rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--gold); border: 1px solid rgba(var(--gold-rgb), .35); border-radius: 999px; padding: .2rem .6rem;
}

/* ============================================================
   ABOUT
============================================================ */
.about-grid{ display: grid; gap: 2.6rem; align-items: center; }
.about-grid .frame{ aspect-ratio: 4/5; }
.about-text .eyebrow{ margin-bottom: 1rem; }
.about-text h2{ font-size: var(--fs-h2); color: var(--cream); }
.about-text p{ margin-top: 1.2rem; font-size: 1.05rem; }
.about-credit{
  margin-top: 1.8rem; padding-top: 1.4rem; border-top: 1px solid rgba(var(--gold-rgb), .22);
  font-family: var(--font-display); font-style: italic; font-size: 1.15rem; color: var(--gold-light);
}
.about-credit span{ display: block; margin-top: .3rem; font-family: var(--font-body); font-style: normal; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--cream-dim); }

@media (min-width: 900px){
  .about-grid{ grid-template-columns: .85fr 1fr; }
}

/* ============================================================
   SERVICES
============================================================ */
.services-grid{ display: grid; gap: 1.4rem; margin-top: 3rem; grid-template-columns: 1fr; }
@media (min-width: 640px){ .services-grid{ grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1180px){ .services-grid{ grid-template-columns: repeat(4, 1fr); } }

.service-card{
  padding: 2rem 1.7rem; border-radius: var(--radius-lg);
  background: linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.01));
  border: 1px solid rgba(var(--gold-rgb), .16);
  backdrop-filter: blur(6px);
  transition: transform .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease);
  display: flex; flex-direction: column;
}
.service-card:hover{ transform: translateY(-6px); border-color: rgba(var(--gold-rgb), .45); box-shadow: 0 20px 40px -20px rgba(var(--gold-rgb), .35); }
.service-icon{
  width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: rgba(var(--gold-rgb), .12); color: var(--gold); margin-bottom: 1.3rem;
}
.service-icon svg{ width: 24px; height: 24px; }
.service-card h3{ color: var(--cream); font-size: var(--fs-h3); }
.service-card ul{ margin-top: .9rem; display: flex; flex-direction: column; gap: .35rem; }
.service-card ul li{ font-size: .92rem; color: var(--cream-dim); padding-left: .9rem; position: relative; }
.service-card ul li::before{ content: ""; position: absolute; left: 0; top: .65em; width: 5px; height: 1px; background: var(--gold); }
.service-card p{ margin-top: .9rem; font-size: .92rem; }
.service-card .btn{ margin-top: 1.5rem; align-self: flex-start; }

/* ============================================================
   GALLERY
============================================================ */
.gallery-grid{ display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 3rem; }
.gallery-tile{
  aspect-ratio: 1/1; cursor: pointer; transition: transform .5s var(--ease), border-color .4s var(--ease);
}
.gallery-tile:hover{ transform: translateY(-4px); }
.gallery-tile:hover .frame{ border-color: rgba(var(--gold-rgb), .6); box-shadow: 0 0 40px -6px rgba(var(--gold-rgb), .4); }
.gallery-tile .frame{ width: 100%; height: 100%; transition: box-shadow .4s var(--ease), border-color .4s var(--ease); }
.gallery-tile .frame-body svg{ transition: transform .5s var(--ease); }
.gallery-tile:hover .frame-body svg{ transform: scale(1.12); }

@media (min-width: 640px){
  .gallery-grid{ grid-template-columns: repeat(2, 1fr); }
  .gallery-tile.featured{ grid-column: span 2; grid-row: span 2; }
}
@media (min-width: 1024px){
  .gallery-grid{ grid-template-columns: repeat(4, 1fr); }
}

.gallery-cta{ margin-top: 3rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1.2rem; justify-content: center; }

/* ============================================================
   WHY GLAM AVE
============================================================ */
.why-grid{ display: grid; gap: 1.3rem; margin-top: 3rem; grid-template-columns: 1fr; }
@media (min-width: 640px){ .why-grid{ grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1180px){ .why-grid{ grid-template-columns: repeat(4, 1fr); } }
.why-card{ padding: 1.9rem 1.6rem; border-top: 1px solid rgba(var(--gold-rgb), .3); }
.why-card svg{ width: 26px; height: 26px; color: var(--gold); margin-bottom: 1.1rem; }
.why-card h3{ font-size: 1.15rem; color: var(--cream); }
.why-card p{ margin-top: .6rem; font-size: .92rem; }

/* ============================================================
   SOCIAL / INSTAGRAM STRIP
============================================================ */
.social{
  background: linear-gradient(180deg, var(--charcoal), var(--black));
  border-top: 1px solid rgba(var(--gold-rgb), .16);
  border-bottom: 1px solid rgba(var(--gold-rgb), .16);
}
.social-inner{ display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1.3rem; }
.social-icon{ width: 46px; height: 46px; color: var(--gold); }
